name: Admin Frontend Build and Push

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main
      - dev/**
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set environment input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            # push 이벤트: main은 prod, 나머지는 dev
            if [ "${{ github.ref_name }}" == "main" ]; then
              echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
            else
              echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
            fi
          fi

      - name: Initialize Variables
        id: vars
        run: |
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set Dockerfile path
        id: dockerfile
        run: |
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=./Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Generate Docker tags
        id: meta
        run: |
          REPO="ghcr.io/${{ steps.vars.outputs.OWNER_LOWER }}/ibx-brewsync-admin-frontend"
          BRANCH_TAG="${{ steps.vars.outputs.BRANCH_SLUG }}-${{ env.DEPLOY_ENV }}"

          TAGS="${REPO}:${BRANCH_TAG}"
          TAGS="${TAGS},${REPO}:${BRANCH_TAG}-${{ steps.vars.outputs.SHORT_SHA }}"

          # main + prod 일 때만 latest 태그
          if [[ "${{ github.ref_name }}" == "main" && "${{ env.DEPLOY_ENV }}" == "prod" ]]; then
            TAGS="${TAGS},${REPO}:latest"
            TAGS="${TAGS},${REPO}:prod-latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.TIMESTAMP }}

      - name: Output Image Tags
        run: |
          echo "### 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: \`${{ env.DEPLOY_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ steps.vars.outputs.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
